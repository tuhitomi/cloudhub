name: Publish CloudHub website

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/cloudhub/catalog.py'
      - 'scripts/build_pages_preview.py'
      - 'scripts/build_pages_live.py'
      - 'scripts/build_pages_redirect.py'
      - 'scripts/generate_infra.py'
      - 'config/pages-public.json'
      - 'config/pages-redirect.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: cloudhub-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build public browser assets
        run: |
          if [ -f config/pages-redirect.json ]; then
            python3 scripts/build_pages_redirect.py --config config/pages-redirect.json --out site
          elif [ -f config/pages-public.json ]; then
            python3 scripts/build_pages_live.py --config config/pages-public.json --out site
          else
            python3 scripts/build_pages_preview.py --out site
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
